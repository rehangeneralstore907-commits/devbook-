    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .phone-frame {
            width: 100%;
            max-width: 380px;
            background-color: #000;
            border: 2px solid #c5a059; 
            padding: 25px 15px;
            text-align: center;
            position: relative;
        }

        .logo {
            color: #c5a059;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .badge {
            background-color: #fff;
            color: #000;
            display: inline-block;
            padding: 3px 12px;
            font-size: 11px;
            font-weight: 800;
            border-radius: 2px;
            margin-bottom: 30px;
        }

        .hero-text {
            color: #fff;
            font-size: 34px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .hero-text span {
            color: #c5a059;
        }

        .whatsapp-btn {
            display: block;
            background: linear-gradient(180deg, #37d67a 0%, #21a35a 100%);
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(33, 163, 90, 0.4);
            border: 1px solid #1e8e4e;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-item {
            border: 1px solid #c5a059;
            border-radius: 12px;
            padding: 20px 10px;
            color: #fff;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .grid-item i {
            font-size: 35px;
            margin-bottom: 12px;
            display: block;
        }

        .grid-item p {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
